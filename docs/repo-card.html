<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="GitHub repo for Round Table Workspace, a local-first review workflow for AI coding agents." />
  <meta name="theme-color" content="#0d1117" />
  <meta property="og:title" content="GitHub - MarkDonish/round-table-workspace" />
  <meta property="og:description" content="Local-first round-table review workflow for AI coding agents: /room exploration, /debate review, and ship-check decisions before trusting generated work." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://markdonish.github.io/round-table-workspace/repo-card.html" />
  <meta property="og:image" content="https://markdonish.github.io/round-table-workspace/repo-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GitHub - MarkDonish/round-table-workspace" />
  <meta name="twitter:description" content="Local-first round-table review workflow for AI coding agents before trusting generated work." />
  <meta name="twitter:image" content="https://markdonish.github.io/round-table-workspace/repo-card.png" />
  <title>GitHub - MarkDonish/round-table-workspace</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --ink: #f0f6fc;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #2f81f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }
    .eyebrow {
      color: var(--muted);
      font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    h1 {
      margin: 12px 0 14px;
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1;
      letter-spacing: -.04em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 16px;
      color: #fff;
      background: var(--accent);
      text-decoration: none;
      font-weight: 750;
    }
  </style>
  <script>
    window.setTimeout(function () {
      window.location.href = "https://github.com/MarkDonish/round-table-workspace";
    }, 900);
  </script>
</head>
<body>
  <main>
    <div class="eyebrow">github.com/MarkDonish/round-table-workspace</div>
    <h1>Round Table Workspace</h1>
    <p>
      Local-first round-table review workflow for AI coding agents:
      /room exploration, /debate review, and ship-check decisions before
      trusting generated work.
    </p>
    <a href="https://github.com/MarkDonish/round-table-workspace">Open the GitHub repository</a>
  </main>
</body>
</html>
