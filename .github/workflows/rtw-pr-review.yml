name: Round Table PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  roundtable-review:
    name: Multi-Agent Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Round Table Review Gate
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_reject: "true"
          fail_on_revise: "false"
